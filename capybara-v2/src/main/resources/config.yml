# CAPYBARA SMP configuration (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
# <value> is replaced with the stat value.

# Starting money for new players. You can use K, M, B, T, QA, QI, SX, SP, OC, NO, DC.
start-money: "1K"
start-lives: 3
max-lives: 20

lives:
  lose-on-death: true
  # NONE or SPECTATOR
  on-zero-lives: NONE

# Skelly Spawner: looks like a skeleton spawner but NEVER spawns mobs. It generates money for its owner.
skelly-spawner:
  amount: "25"          # money per interval (K, M, B ... allowed)
  interval-seconds: 10  # how often the owner gets paid
  hologram: true        # floating text above the spawner
  particles: true       # green sparkles on every payout

scoreboard:
  title: "<bold><gradient:#1e90ff:#00e5ff>CAPYBARA SMP</gradient></bold>"
  always-show-hours: true
  lines:
    kills: "<red>⚔ <white>Kills <red><value>"
    deaths: "<gold>☠ <white>Deaths <gold><value>"
    money: "<green>$ <white>Money <green><value>"
    playtime: "<yellow>⏱ <white>Playtime <yellow><value>"
    lives: "<red>❤ <white>Lives <red><value>"
